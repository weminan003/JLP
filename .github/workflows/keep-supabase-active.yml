name: Keep Supabase Active

# Supabase pauses free-tier projects after 1 week of inactivity.
# This workflow pings the project REST API every 3 days so it never goes idle.
on:
  schedule:
    # 08:00 UTC every 3 days
    - cron: "0 8 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Send keep-alive request
        run: |
          # /rest/v1/ returns 401 without a valid key on some project configs.
          # The health endpoint requires no auth and returns 200 when the project is awake.
          HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/?apikey=${SUPABASE_ANON_KEY}")

          echo "Response status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 404 ]; then
            echo "Supabase project is active."
          else
            echo "Unexpected status $HTTP_STATUS — check SUPABASE_URL and SUPABASE_ANON_KEY secrets."
            exit 1
          fi
